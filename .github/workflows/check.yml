name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.19.0, 24.12.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run benchmark

  upstream-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
      - name: Report certification drift without widening support
        run: |
          current=$(npm view @earendil-works/pi-coding-agent version)
          certified=$(node -p "require('./package.json').peerDependencies['@earendil-works/pi-coding-agent']")
          echo "Published Pi: $current; certified Pi: $certified" >> "$GITHUB_STEP_SUMMARY"
          if [ "$current" != "$certified" ]; then
            echo "::warning::A newer Pi release requires an explicit compatibility investigation. It is not certified by this job."
          fi
